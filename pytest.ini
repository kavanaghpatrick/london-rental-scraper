[pytest]
# Test configuration for the London rental scraper.
#
# Default `pytest` run executes UNIT tests only (no network).
# Live smoke tests are OPT-IN: run with `pytest -m live` (or `pytest --runlive`).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    live: hits real sites over the network (opt-in; excluded from default CI). Run with `pytest -m live`.
    smoke: small end-to-end live crawl (1-2 pages). Implies live.
    selector: selector-regression test — fails loudly if site markup/JSON shape drifts.
    parity: JS↔Python golden-fixture drift gate (runs node chrome-extension/_fixture_diff.mjs).
    data: reads the live canonical rentals.db — auto-skipped by tests/conftest.py when no
        populated DB is present (runs in daily-scrape post-scrape, not PR CI). (#49)
    unit: pure-unit / self-contained (no DB, no network) — always runs, gates PR. (#49)
    dashboard: serving-layer route tests — spin up `next dev` + an ephemeral Postgres.
        Opt-in (heavy): run with `pytest -m dashboard`; auto-skipped when node/next/
        testing.postgresql aren't available so default PR CI stays green. (#48)

# strict_markers: a TYPO'd marker (e.g. @pytest.mark.unti) is a hard ERROR, not a
# silently-unknown marker that changes selection behaviour — part of the anti-silent-
# skip discipline (#49). All custom markers MUST be registered above; the meta-test
# tests/test_ci_critical_tests_run.py then guards that critical tests keep RUNNING.
# NOTE: this is the INI option `strict_markers = true`, NOT `--strict-markers` in
# addopts. In pytest 9 the `--strict-markers` *flag* placed in addopts is a NO-OP (it
# only takes effect on the command line), so the typo-guard was silently inert; the
# ini boolean below is the form that actually errors. (Verified on pytest 9.0.1.)
strict_markers = true

# Exclude live tests from the default run. Override with `-m live` or `--runlive`.
addopts = -m "not live" -ra

# The v20 feature-engineering emits pandas PerformanceWarnings (fragmented frame
# from many per-column assigns) — cosmetic, not a correctness signal. Silence them
# so model-test CI output stays readable.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*DataFrame is highly fragmented.*:Warning
    ignore:.*Downcasting object dtype.*:FutureWarning
    ignore:Mean of empty slice:RuntimeWarning
