name: Daily Property Scrape

on:
  schedule:
    # Run daily at 6 AM UTC (7 AM UK time in winter, 8 AM in summer)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      spiders:
        description: 'Spiders to run (comma-separated or "all")'
        required: false
        default: 'all'
      full_mode:
        description: 'Run with --full (fetch details + floorplans)'
        required: false
        default: 'true'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  # Vercel Postgres connection (set in GitHub Secrets)
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour timeout (scrape takes ~2 hours)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Node is needed for the post-retrain JS<->Python parity gate (fixture_diff.mjs),
      # which blocks the model commit if a retrain desyncs the served JS predictor (#14).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Install tesseract OCR (for inline floorplan OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install pytesseract pillow

      - name: Check Postgres connection
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              print("ERROR: POSTGRES_URL not set!")
              exit(1)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()
              cursor.execute("SELECT COUNT(*) FROM listings")
              count = cursor.fetchone()[0]
              print(f"Connected to Vercel Postgres. Current listings: {count}")
              conn.close()
          except Exception as e:
              print(f"Database connection failed: {e}")
              print("Will create tables on first scrape")
          EOF

      - name: Run scraper (Postgres mode)
        id: scrape
        env:
          # Use Postgres settings for all spiders
          USE_POSTGRES: "true"
        run: |
          # Determine spider arguments
          SPIDER_ARG=""
          if [ "${{ github.event.inputs.spiders }}" != "" ] && [ "${{ github.event.inputs.spiders }}" != "all" ]; then
            IFS=',' read -ra SPIDERS <<< "${{ github.event.inputs.spiders }}"
            for spider in "${SPIDERS[@]}"; do
              SPIDER_ARG="$SPIDER_ARG -s $(echo $spider | xargs)"
            done
          else
            SPIDER_ARG="--all"
          fi

          # Determine full mode
          FULL_FLAG=""
          if [ "${{ github.event.inputs.full_mode }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FULL_FLAG="--full"
          fi

          # Run the scrape with Postgres settings
          echo "Running: python -m cli.main scrape $SPIDER_ARG $FULL_FLAG --postgres"
          python -m cli.main scrape $SPIDER_ARG $FULL_FLAG --postgres 2>&1 | tee scrape_output.txt

          # Extract summary for GitHub output
          ITEMS=$(grep -oP 'Total: \K[\d,]+' scrape_output.txt | tail -1 || echo "0")
          echo "items_scraped=$ITEMS" >> $GITHUB_OUTPUT

      - name: Capture pre-OCR sqft baseline (for the OCR-starvation gate)
        id: ocr_baseline
        run: |
          # WS3 OCR-STARVATION GATE (pre-leg): snapshot how many rows already have a
          # usable size_sqft BEFORE the floorplan-enrich + OCR legs run. The post-OCR
          # gate (below, before retrain/commit) compares against this to compute how
          # many sqft were RECOVERED this run, and FAILS if zero were recovered while a
          # meaningful backlog of floorplan'd-but-no-sqft rows still exists (the silent
          # "OCR write path is dead" failure the floorplan-OCR postmortem documented).
          python3 << 'EOF'
          import os, psycopg2
          url = os.environ.get('POSTGRES_URL')
          before = -1
          if url:
              try:
                  conn = psycopg2.connect(url); cur = conn.cursor()
                  cur.execute("SELECT COUNT(*) FROM listings WHERE size_sqft > 0")
                  before = cur.fetchone()[0]
                  conn.close()
              except Exception as e:
                  print(f"baseline query failed (non-fatal, gate will note it): {e}")
          print(f"with_sqft_before={before}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"with_sqft_before={before}\n")
          EOF

      - name: Capture floorplan URLs (enrich-floorplans, Postgres)
        continue-on-error: true
        env:
          USE_POSTGRES: "true"
        run: |
          # WS3 FIX: Rightmove search results rarely carry floorplan_url, so the
          # downstream OCR backlog step (which SELECTs WHERE floorplan_url IS NOT
          # NULL) was STARVING — Rightmove is ~86% of the no-sqft hole. Run the
          # floorplan_enricher FIRST to fetch detail pages
          # and write floorplan_url, into the SAME Postgres DB the OCR step reads
          # (--postgres -> uses $POSTGRES_URL). --limit caps the run so it finishes
          # inside the timeout. The enricher's UPDATE is non-destructive.
          echo "Capturing floorplan URLs for rightmove (Postgres)..."
          python -m cli.main enrich-floorplans --source rightmove --postgres --limit 300 2>&1 | tee enrich_output.txt || true
          echo "=== Floorplan URL capture complete ==="
        timeout-minutes: 30

      - name: Run OCR enrichment on backlog floorplans
        continue-on-error: true
        run: |
          # OCR enrichment for listings that weren't processed during scraping
          # Only process sources whose CDNs work from GitHub Actions:
          # - Chestertons: Always returns 403 (blocked)
          # - Foxtons: Extremely slow (rate limited), takes 30s/image vs 0.6s locally
          # - Rightmove/Savills/KnightFrank: Work normally
          echo "Running OCR enrichment on backlog floorplans..."

          # Process each working source separately (skip foxtons/chestertons - blocked/slow)
          for source in rightmove savills knightfrank; do
            echo "Processing $source..."
            python scripts/ocr_enrich.py --source $source --workers 2 --limit 100 --timeout 60 2>&1 || true
          done

          echo ""
          echo "=== OCR Enrichment Complete ==="
        timeout-minutes: 20

      - name: Mark stale listings inactive
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              exit(0)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()

              # CYCLE-RELATIVE mark-inactive (per the Neon truncate-incident postmortem
              # §5.1 + the cli.main / test_data_layer_safety._mark_inactive_guarded
              # reference). DO NOT revert this to wall-clock NOW():
              #
              #   The old `last_seen < NOW() - INTERVAL '2 days'` compared against the
              #   WALL CLOCK. Prod is a FROZEN snapshot (its newest last_seen does not
              #   advance because prod's nightly scrape finds nothing fresh), so once the
              #   snapshot was >2 days old, EVERY row matched -> is_active wiped to 0 ->
              #   /api/similar returned 0 peers -> the Compare button broke. A manual
              #   re-sync restored ~7,831 active, and the next night's run wiped it again.
              #
              # The fix anchors the cutoff to the DATA'S OWN latest last_seen, not NOW():
              #   - On a frozen snapshot (all last_seen ~= MAX) NOTHING is >2 days older
              #     than the freshest row, so ZERO rows flip -> the synced active set
              #     STAYS active. (Self-healing: no run can re-wipe a frozen prod.)
              #   - When a real scrape advances some last_seen to "now", MAX advances and
              #     genuinely-unseen listings correctly age out >2 days behind it.
              #
              # SAFETY: this ONLY flips is_active (a REVERSIBLE boolean a re-sync
              # restores). It NEVER deletes/truncates a row. NULL last_seen is excluded
              # (NULL < anything is NULL/false in SQL, so a row with no last_seen is left
              # active rather than wrongly retired). Empty table -> MAX is NULL -> the
              # subquery yields NULL -> the comparison is never true -> 0 rows, no error.
              cursor.execute("""
                  UPDATE listings
                  SET is_active = 0
                  WHERE last_seen IS NOT NULL
                  AND last_seen::timestamp
                      < (SELECT MAX(last_seen::timestamp) FROM listings)
                        - INTERVAL '2 days'
                  AND is_active = 1
              """)
              marked = cursor.rowcount
              # >50% ABORT (defense-in-depth, mirrors cli/main.py mark_inactive 765-781).
              # The cycle-relative cutoff already prevents the frozen-snapshot 100% wipe; this
              # catches a DIFFERENT class — a mis-dated MAX(last_seen) sweeping the cutoff past
              # most rows. Measure against the ACTIVE set (same dilution lesson as A13). is_active
              # is reversible so we rollback (never commit a mass flip) and fail the step.
              cursor.execute("SELECT COUNT(*) FROM listings WHERE is_active = 1")
              active_after = cursor.fetchone()[0]
              active_before = active_after + marked
              if active_before > 0 and marked > 0.5 * active_before:
                  conn.rollback()
                  conn.close()
                  print(f"::error::mark-inactive would flip {marked}/{active_before} "
                        f"({100*marked/active_before:.0f}%) of active listings (>50%) — refusing, rolled back")
                  raise SystemExit(1)
              conn.commit()

              if marked > 0:
                  print(f"Marked {marked} stale listings as inactive (cycle-relative to MAX(last_seen))")
              else:
                  print("No stale listings to mark inactive (cycle-relative cutoff)")

              conn.close()
          except Exception as e:
              print(f"Error marking inactive: {e}")
          EOF

      - name: Show database stats
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              print("POSTGRES_URL not set")
              exit(0)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()

              print("=== Post-scrape database stats ===")
              cursor.execute("""
                  SELECT source, COUNT(*) as total,
                         SUM(CASE WHEN is_active = 1 THEN 1 ELSE 0 END) as active,
                         SUM(CASE WHEN size_sqft > 0 THEN 1 ELSE 0 END) as with_sqft
                  FROM listings GROUP BY source ORDER BY total DESC
              """)
              for row in cursor.fetchall():
                  print(f"  {row[0]}: {row[1]} total, {row[2]} active, {row[3]} with sqft")

              cursor.execute("SELECT COUNT(*) FROM listings")
              print(f"\nTotal listings: {cursor.fetchone()[0]}")

              cursor.execute("SELECT COUNT(*) FROM listings WHERE size_sqft > 0")
              print(f"With sqft: {cursor.fetchone()[0]}")

              conn.close()
          except Exception as e:
              print(f"Error querying database: {e}")
          EOF

      - name: Show recent scrape runs
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              exit(0)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()

              print("=== Recent Scrape Runs ===")
              cursor.execute("""
                  SELECT run_id, spider_name, status, items_scraped, error_count,
                         ROUND(duration_seconds/60, 1) as minutes
                  FROM scrape_runs
                  ORDER BY started_at DESC
                  LIMIT 10
              """)
              for row in cursor.fetchall():
                  status_icon = "✓" if row[2] == "completed" else "✗"
                  print(f"  {status_icon} {row[0]} | {row[1]}: {row[3]} items, {row[4]} errors ({row[5]}m)")

              conn.close()
          except Exception as e:
              print(f"Error: {e}")
          EOF

      - name: Clean duplicate listings (cross-source, fingerprint identity)
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              print("POSTGRES_URL not set")
              exit(0)

          # Cross-source dedupe identity lives in ONE tested, importable module
          # (scripts/dedupe_postgres.py) keyed on the structural address_fingerprint
          # — NOT the old inline fuzzy union-find that over-deleted 39.5% (#5).
          # The actual DELETE goes through scripts/_safe_delete.guarded_delete, which
          # keeps the 10% delta-abort guard and writes a CSV backup before deleting.
          from dedupe_postgres import find_cross_source_duplicate_ids
          from _safe_delete import guarded_delete, SafeDeleteAborted

          conn = psycopg2.connect(url)
          cur = conn.cursor()

          cur.execute("""
              SELECT id, source, property_id, address, postcode, price_pcm, bedrooms, size_sqft
              FROM listings WHERE is_active = 1 AND price_pcm > 0 ORDER BY id
          """)
          cols = ['id', 'source', 'property_id', 'address', 'postcode',
                  'price_pcm', 'bedrooms', 'size_sqft']
          rows = [dict(zip(cols, r)) for r in cur.fetchall()]
          print(f"Checking {len(rows)} active listings for cross-source duplicates...")

          to_delete = find_cross_source_duplicate_ids(rows)

          if not to_delete:
              print("✅ No cross-source duplicates found")
              conn.close()
              raise SystemExit(0)

          # Denominator MUST be the candidate set the proposal is drawn from (active, priced),
          # not COUNT(*) whole table — inactive rows dilute the fraction and the 10% guard
          # never trips on an active-set over-delete (denominator dilution, A13).
          cur.execute("SELECT COUNT(*) FROM listings WHERE is_active = 1 AND price_pcm > 0")
          total = cur.fetchone()[0]

          def _do_delete(ids):
              ph = ','.join(['%s'] * len(ids))
              cur.execute(f"DELETE FROM price_history WHERE listing_id IN ({ph})", list(ids))
              cur.execute(f"DELETE FROM listings WHERE id IN ({ph})", list(ids))

          try:
              backup = guarded_delete(
                  cur, "listings", to_delete,
                  total_rows=total, do_delete=_do_delete,
                  label="daily-scrape cross-source dedupe",
              )
              conn.commit()
              print(f"✅ Removed {len(to_delete)} cross-source duplicates "
                    f"({len(to_delete)/total*100:.2f}% of listings; backup -> {backup})")
          except SafeDeleteAborted as e:
              conn.rollback()
              print(f"::error::{e}")
              conn.close()
              raise SystemExit(1)

          conn.close()
          EOF
        env:
          # Make scripts/ and the repo root importable for the heredoc above.
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

      # =====================================================================
      # A1 — THE DATA GATE (highest-leverage Wave-1 fix).
      #
      # daily-scrape used to run NO pytest at all: a bad scrape or a regressed
      # OCR/dedupe leg would be COMMITTED and RETRAINED with zero validation.
      # These two steps run AFTER scrape/enrich/OCR/mark-inactive/dedupe and
      # BEFORE the retrain + commit. Because GitHub steps are sequential and a
      # failing step fails the job, ANY failure here SKIPS the retrain/commit/
      # push steps below — so a bad scrape/model never reaches main.
      #
      # WHY CI (ci.yml) CAN'T CATCH THIS: PR CI has no populated rentals.db
      # (it's gitignored), so the `data`-marked suites auto-skip there. They
      # only have real data to validate HERE, post-scrape, against the freshly
      # materialized DB. The meta-test tests/test_ci_critical_tests_run.py
      # ::test_daily_scrape_runs_pytest_data_gate pins this step's existence so
      # it can't silently regress back to "no pytest".
      # =====================================================================
      - name: OCR-starvation gate (pre-retrain) — fail if the OCR write path went dark
        env:
          # floorplan_url backlog this size with ZERO recovery == the dead-write-path
          # signature from the floorplan-OCR postmortem (coverage cliff to 0). Below this
          # backlog a zero-recovery run is plausibly just "nothing left to recover".
          OCR_STARVATION_BACKLOG_THRESHOLD: "200"
          WITH_SQFT_BEFORE: ${{ steps.ocr_baseline.outputs.with_sqft_before }}
        run: |
          python3 << 'EOF'
          import os, sys, psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              print("POSTGRES_URL not set — skipping OCR-starvation gate (no DB to check).")
              sys.exit(0)

          threshold = int(os.environ.get('OCR_STARVATION_BACKLOG_THRESHOLD', '200'))
          before = int(os.environ.get('WITH_SQFT_BEFORE', '-1') or '-1')

          conn = psycopg2.connect(url); cur = conn.cursor()

          # floorplan_url may not exist on every deployment of the schema — degrade
          # gracefully (the gate only bites where the column + a real backlog exist).
          cur.execute(
              "SELECT COUNT(*) FROM information_schema.columns "
              "WHERE table_name='listings' AND column_name='floorplan_url'"
          )
          have_floorplan_col = cur.fetchone()[0] > 0

          cur.execute("SELECT COUNT(*) FROM listings WHERE size_sqft > 0")
          after = cur.fetchone()[0]
          recovered = (after - before) if before >= 0 else None

          backlog = None
          if have_floorplan_col:
              cur.execute(
                  "SELECT COUNT(*) FROM listings "
                  "WHERE floorplan_url IS NOT NULL AND floorplan_url != '' "
                  "AND (size_sqft IS NULL OR size_sqft = 0)"
              )
              backlog = cur.fetchone()[0]
          conn.close()

          print(f"with_sqft before={before} after={after} recovered={recovered}")
          print(f"floorplan_url-but-no-sqft backlog={backlog} "
                f"(threshold={threshold}, floorplan_col={have_floorplan_col})")

          if not have_floorplan_col:
              print("listings.floorplan_url absent — OCR-starvation gate not applicable; passing.")
              sys.exit(0)
          if before < 0:
              print("::warning::pre-OCR baseline unavailable — cannot compute recovery delta; "
                    "OCR-starvation gate is advisory this run.")
              sys.exit(0)

          # The bite: a real backlog of floorplan'd-but-no-sqft rows exists, yet this run
          # recovered ZERO sqft -> the floorplan->OCR->sqft WRITE PATH is dead (orphaned
          # enricher / wrong DB / Postgres-SQLite split). Retraining now bakes in the hole.
          if recovered == 0 and backlog > threshold:
              print(f"::error::OCR STARVATION: recovered 0 sqft this run while {backlog} "
                    f"floorplan'd rows still have no sqft (> {threshold}). The OCR write "
                    f"path is dead — refusing to retrain/commit on a starved DB. See the "
                    f"floorplan-OCR postmortem (enrich-floorplans -> ocr_enrich wiring).")
              sys.exit(1)

          print("OCR-starvation gate OK (recovery > 0, or backlog below threshold).")
          EOF

      - name: Materialize Postgres -> SQLite (for the data gate + the trainer)
        run: |
          pip install psycopg2-binary
          # ONE materialization shared by the data gate (below) and the retrain step,
          # so the gate validates EXACTLY the DB the model trains on. The scrape wrote
          # Postgres; retrain_canonical.py + the data-validation suites read SQLite.
          echo "Materializing Postgres -> SQLite (output/rentals.db)..."
          python3 scripts/pg_to_sqlite.py --out output/rentals.db 2>&1 | tee model_output.txt

      - name: Data-validation gate (pytest -m data) — blocks retrain/commit on a bad scrape
        run: |
          pip install pytest
          # Run the DATA-marked validation suites against the freshly materialized
          # output/rentals.db (conftest sees a populated live DB -> runs them for real
          # instead of auto-skipping as it does in PR CI). A failure here fails the job,
          # so the retrain + commit + push steps BELOW are skipped: a bad scrape/dedupe/
          # OCR result is never trained on or pushed to main.
          #
          # `not live`: the `data`-marked OCR-accuracy tests are ALSO `live` (they hit
          # floorplan CDNs); exclude the network leg so the gate stays deterministic +
          # CDN-outage-proof. The structural dedupe/backfill `data` invariants still run.
          echo "Running post-scrape data-validation gate..."
          python3 -m pytest -m "data and not live" \
            tests/test_scrape_validation.py \
            tests/test_dedupe_postgres.py \
            tests/test_backfill_acceptance.py \
            tests/test_ocr_accuracy.py \
            -q 2>&1 | tee -a model_output.txt

      - name: Retrain CANONICAL model (v20) after scrape
        run: |
          pip install xgboost scikit-learn optuna pandas numpy psycopg2-binary
          # FIX (#9): retrain ONE canonical version (rental_model_canonical.pkl), not
          # an ad-hoc v20 file. The DB was already materialized Postgres -> SQLite by the
          # "Materialize Postgres -> SQLite" step above (so the data gate validated the
          # EXACT DB we train on); reuse output/rentals.db here rather than re-pulling.

          echo "Retraining canonical model..."
          # retrain_canonical.py also emits output/rental_model_canonical_inference.json in
          # the SAME run (modeler folded gen_inference_stats in). That sidecar is REQUIRED by
          # canonical_predict.build_features(inference=True) — without it, single-row predict
          # regresses to the degenerate £3,430 bug — and it's committed below with the pkl.
          python3 retrain_canonical.py --db output/rentals.db 2>&1 | tee -a model_output.txt

          echo "Exporting canonical model to the Chrome extension format..."
          python3 - <<'PY' 2>&1 | tee -a model_output.txt
          # Modeler's blessed entrypoint: writes model.json + features.json as ONE
          # matched pair via the Booster JSON (no xgboost wrapper save_model quirk).
          import canonical_predict as cp
          mp, fp = cp.export_to_chrome('chrome-extension/api')
          import json, os
          n = len(json.load(open('chrome-extension/api/features.json')))
          assert os.path.getsize('chrome-extension/api/model.json') > 1024, 'model.json not written'
          print(f'chrome export verified: {n} features')
          PY

          # --- #14: regenerate the FULL matched artifact set so a retrain can't drift ---
          # The retrain rewrote inference.json (new freqs / default). Re-bake the JS
          # predictor's hardcoded POSTCODE_FREQ maps from it + re-vendor the dashboard copy,
          # then regenerate the golden parity fixture from the new model — so the served JS
          # map, the vendored predictor, and the golden all move WITH the model. Without this
          # the daily retrain desyncs them (the gap that clobbered the matched set, fa669cd).
          echo "Re-baking JS freq maps + re-vendoring (sync_js_freq_maps)..."
          python3 scripts/sync_js_freq_maps.py 2>&1 | tee -a model_output.txt
          echo "Regenerating golden parity fixture from the new model..."
          python3 gen_feature_parity_golden.py 2>&1 | tee -a model_output.txt
        timeout-minutes: 30

      - name: Verify JS<->Python parity (gate — blocks the model commit on any desync)
        run: |
          # Fail the job (so the Commit step below is SKIPPED) if the retrain left the served
          # JS predictor inconsistent with the Python golden / inference.json. The safety net
          # that prevents the daily auto-update from EVER pushing a desynced model (#14).
          node chrome-extension/fixture_diff.mjs
          python3 scripts/sync_js_freq_maps.py --check
          echo "JS<->Python parity verified (0/0) — matched artifact set is consistent"

      - name: Commit canonical model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Served extension artifacts + the canonical pkls (-f: .pkl is gitignored).
          git add chrome-extension/api/model.json
          git add chrome-extension/api/features.json
          git add -f output/rental_model_canonical.pkl
          git add -f output/rental_model_canonical_features.pkl
          git add -f output/rental_model_canonical_meta.json
          # Inference stats (freq maps) — REQUIRED alongside the pkl or single-row
          # predict silently regresses to the £3,430 degenerate bug. Not gitignored.
          git add output/rental_model_canonical_inference.json
          # #14: the re-baked JS predictor + its vendored copy + the regenerated golden —
          # committed ATOMICALLY with the model so the served matched set never drifts.
          git add chrome-extension/xgboost.js
          git add dashboard/src/app/api/predict/xgboost.predictor.js
          git add output/feature_parity_golden.json

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Auto-update canonical model $(date +%Y-%m-%d) [skip ci]"
            git push
            echo "✅ Canonical model files committed and pushed"
          fi

      - name: Show model results
        run: |
          python3 << 'EOF'
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              exit(0)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()

              cursor.execute("""
                  SELECT run_id, version, samples_total, r2_score, mae, mape, median_ape
                  FROM model_runs ORDER BY created_at DESC LIMIT 1
              """)
              row = cursor.fetchone()
              if row:
                  print(f"=== Latest Model: {row[0]} ({row[1]}) ===")
                  print(f"  Samples: {row[2]}")
                  print(f"  R²: {row[3]:.4f}")
                  print(f"  MAE: £{row[4]:,.0f}")
                  print(f"  MAPE: {row[5]:.1f}%")
                  print(f"  Median APE: {row[6]:.1f}%")

              conn.close()
          except Exception as e:
              print(f"Error: {e}")
          EOF

      # Note: Negotiation report is now generated dynamically at /report
      # No static files needed - data is fetched fresh from Postgres on each load

      - name: Upload logs artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scrape-logs-${{ github.run_id }}
          path: |
            logs/*.log
            scrape_output.txt
            ocr_output.txt
            model_output.txt
            output/deleted_backups/*.csv
          retention-days: 7

      - name: Create summary
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Items scraped:** ${{ steps.scrape.outputs.items_scraped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** Vercel Postgres" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** https://dashboard-fawn-nu-59.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import os
          import psycopg2

          url = os.environ.get('POSTGRES_URL')
          if not url:
              print("Database not configured")
              exit(0)

          try:
              conn = psycopg2.connect(url)
              cursor = conn.cursor()

              print("### Database Stats")
              print("| Source | Total | Active | With sqft |")
              print("|--------|-------|--------|-----------|")

              cursor.execute("""
                  SELECT source, COUNT(*),
                         SUM(CASE WHEN is_active = 1 THEN 1 ELSE 0 END),
                         SUM(CASE WHEN size_sqft > 0 THEN 1 ELSE 0 END)
                  FROM listings GROUP BY source ORDER BY COUNT(*) DESC
              """)
              for row in cursor.fetchall():
                  print(f"| {row[0]} | {row[1]} | {row[2]} | {row[3]} |")

              conn.close()
          except Exception as e:
              print(f"Error: {e}")
          EOF

  notify-failure:
    needs: scrape
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Scrape failed: ${new Date().toISOString().split('T')[0]}`;
            const body = `
            The daily scrape workflow failed.

            **Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            **Dashboard:** Check https://dashboard-fawn-nu-59.vercel.app for details.

            Please check the logs for details.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scrape-failure'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['scrape-failure', 'automated']
              });
            }
