name: Extraction Drift Smoke (weekly, live)

# ============================================================================
# WHY THIS WORKFLOW EXISTS — the blind spot ci.yml STRUCTURALLY cannot cover.
#
# ci.yml's extraction + parity harnesses run against FROZEN, COMMITTED fixtures
# (tests/fixtures/**, chrome-extension/*_extract_test.mjs). That is exactly what
# makes them deterministic, network-free, and safe to gate a PR on — but it also
# means they keep passing GREEN forever even after a site silently migrates its
# live DOM / JSON shape out from under our selectors. The whole platform's
# "CI false-green" failure mode is this: the fixture says 2019's Rightmove, the
# live site moved to window.__PAGE_MODEL, and no PR test ever fetches the live
# page to notice. (Real example in the floorplan-OCR + Rightmove __PAGE_MODEL
# postmortems: extraction quietly went to zero while CI stayed green.)
#
# This workflow is the OPPOSITE trade-off on purpose: it hits ONE real live
# search page per spider on a SCHEDULE and asserts the extraction still produces
# real cards with sane magnitudes. It is deliberately:
#   * NON-PR-BLOCKING — it is its own scheduled workflow, NOT a required check on
#     ci.yml. Live sites flake / rate-limit / A-B test; a transient live failure
#     must never block an unrelated PR merge.
#   * ISSUE-ON-FAILURE — instead of red-gating, a failure opens (or reuses) a
#     GitHub issue labelled `extraction-drift` so a human investigates a probable
#     real DOM migration. Signal, not a wall.
#
# Cadence: weekly (sites don't migrate hourly; weekly catches drift within days
# while keeping live traffic + flake noise low).
# ============================================================================

on:
  schedule:
    # Weekly, Mondays 05:17 UTC (off the :00 mark to avoid the cron stampede).
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Spiders to smoke (comma-separated or "all")'
        required: false
        default: 'all'

permissions:
  contents: read
  issues: write

jobs:
  # === A. Spider-side live smoke — one real search page per spider, both modes ===
  spider-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers (savills/knightfrank/chestertons are SPA spiders)
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Live smoke — each spider, ONE search page, rent + sale
        env:
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
        run: |
          # Drive the REAL CLI scrape against a throwaway OUTPUT_DIR (never touches the
          # canonical output/rentals.db — see the "Scrape validation via OUTPUT_DIR
          # override" pattern). ONE page per (spider, mode). Then assert against the
          # scratch DB that extraction produced real cards at the right magnitude with
          # per-source sqft coverage above a conservative floor.
          #
          # PER-SOURCE SQFT FLOORS are set WELL BELOW the documented healthy coverage
          # (savills ~99%, knightfrank ~93%, foxtons ~98%, chestertons ~71%, rightmove
          # ~28% pre-enrichment) so a normal week passes but a COLLAPSE-to-zero (the
          # drift signature) fails. Rightmove search rarely carries sqft, so its floor
          # is 0 (price + card-count are its live signal; sqft is enrichment's job).
          #
          # MAGNITUDE bands catch a rent value parsed as a sale price (or vice-versa) —
          # the exact class of bug R1/R2 fixed in the sale path.
          mkdir -p /tmp/smoke
          python3 - <<'PY'
          import os, subprocess, sqlite3, sys, tempfile, shutil

          # (spider, scratch-DB filename, table, price-col, sqft-floor-fraction)
          RENT = {
              "db": "rentals.db", "table": "listings", "price_col": "price_pcm",
              # plausible London pcm band
              "price_lo": 500, "price_hi": 60000,
          }
          SALE = {
              "db": "sales.db", "table": "sale_listings", "price_col": "asking_price",
              # plausible London asking-price band (£100k .. £60M)
              "price_lo": 100_000, "price_hi": 60_000_000,
          }
          # Conservative sqft-coverage floors (fraction of cards WITH a positive sqft).
          SQFT_FLOOR = {
              "savills": 0.50, "knightfrank": 0.40, "foxtons": 0.40,
              "chestertons": 0.20, "rightmove": 0.0,
          }
          ALL = ["savills", "knightfrank", "chestertons", "foxtons", "rightmove"]

          want = os.environ.get("SOURCES", "all").strip()
          sources = ALL if want in ("", "all") else [s.strip() for s in want.split(",")]

          failures = []

          def run_mode(spider, mode, spec):
              outdir = tempfile.mkdtemp(prefix=f"smoke_{spider}_{mode}_", dir="/tmp/smoke")
              env = dict(os.environ, OUTPUT_DIR=outdir)
              cmd = [
                  sys.executable, "-m", "cli.main", "scrape",
                  "--source", spider, "--max-pages", "1", "--listing-type", mode,
              ]
              print(f"\n=== {spider} [{mode}] -> {outdir} ===")
              try:
                  subprocess.run(cmd, env=env, timeout=600, check=False)
              except subprocess.TimeoutExpired:
                  failures.append(f"{spider}[{mode}]: scrape TIMED OUT (live page hung)")
                  return
              dbp = os.path.join(outdir, spec["db"])
              if not os.path.exists(dbp):
                  failures.append(f"{spider}[{mode}]: no scratch DB written ({spec['db']}) "
                                  f"— spider yielded 0 items (selector/section drift?)")
                  return
              conn = sqlite3.connect(dbp)
              try:
                  cur = conn.cursor()
                  # table may not exist if 0 items in this mode
                  cur.execute("SELECT name FROM sqlite_master WHERE type='table' AND name=?",
                              (spec["table"],))
                  if not cur.fetchone():
                      failures.append(f"{spider}[{mode}]: {spec['table']} table absent — 0 cards extracted")
                      return
                  n = cur.execute(f"SELECT COUNT(*) FROM {spec['table']}").fetchone()[0]
                  if n < 1:
                      failures.append(f"{spider}[{mode}]: 0 cards on the live search page "
                                      f"(>=1 expected) — probable live-DOM drift")
                      return
                  pc = spec["price_col"]
                  in_band = cur.execute(
                      f"SELECT COUNT(*) FROM {spec['table']} "
                      f"WHERE {pc} >= ? AND {pc} <= ?",
                      (spec["price_lo"], spec["price_hi"]),
                  ).fetchone()[0]
                  if in_band < 1:
                      sample = cur.execute(f"SELECT {pc} FROM {spec['table']} LIMIT 5").fetchall()
                      failures.append(f"{spider}[{mode}]: no card with a correct-magnitude "
                                      f"{pc} in [{spec['price_lo']},{spec['price_hi']}] "
                                      f"(got {sample}) — wrong-vertical price?")
                      return
                  floor = SQFT_FLOOR.get(spider, 0.0)
                  with_sqft = cur.execute(
                      f"SELECT COUNT(*) FROM {spec['table']} WHERE size_sqft > 0"
                  ).fetchone()[0]
                  frac = with_sqft / n if n else 0.0
                  print(f"    {spider}[{mode}]: {n} cards, {in_band} in-band {pc}, "
                        f"sqft {with_sqft}/{n}={frac:.0%} (floor {floor:.0%})")
                  if frac < floor:
                      failures.append(f"{spider}[{mode}]: sqft coverage {frac:.0%} "
                                      f"below floor {floor:.0%} ({with_sqft}/{n}) "
                                      f"— sqft extraction may have drifted")
              finally:
                  conn.close()

          for spider in sources:
              run_mode(spider, "rent", RENT)
              run_mode(spider, "sale", SALE)

          print("\n================ SMOKE SUMMARY ================")
          if failures:
              for f in failures:
                  print(f"  DRIFT: {f}")
              print(f"\n{len(failures)} drift signal(s) — see issue.")
              sys.exit(1)
          print("  All spiders extracted live cards at sane magnitudes. No drift.")
          PY

  # === B. Extension headless live check — the IN-BROWSER content.js arm ===
  #
  # The spider smoke (A) covers the SPIDER extraction path. It does NOT cover the
  # Chrome extension's IN-BROWSER extraction — content.js running against the live
  # page DOM (window.__PAGE_MODEL / __NEXT_DATA__ / self.__next_f / JSON-LD) and the
  # Fair-Value popup render. That is the EXACT path the Rightmove __PAGE_MODEL
  # migration broke (memory: "RIGHTMOVE LIKELY BROKEN") with ZERO PR-CI failure,
  # because ci.yml's extension harnesses only ever run content.js against FROZEN
  # committed fixtures (tests/fixtures/**) — never a live page.
  #
  # This job runs chrome-extension/headless_extraction_smoke.mjs, which:
  #   * loads ONE known-live detail URL per site x {rent,sale} in headless Chromium
  #     (Python Playwright — already installed below for the SPA spiders) and lets it
  #     HYDRATE so the runtime data globals are populated as a real browser sees them;
  #   * injects the REAL, UNMODIFIED content.js extractors into that live DOM via the
  #     repo's existing zero-dependency export-trampoline (extract_test_shim.mjs ::
  #     loadExtractors) — the same injector every committed extractor test uses — and
  #     also reproduces the captured runtime window.__PAGE_MODEL so Rightmove's
  #     runtime-global path is exercised too;
  #   * asserts a NON-NULL + PLAUSIBLE price / beds / sqft / postcode and that the
  #     popup WOULD render (the price+beds model inputs both resolve, the sale/rent
  #     fork is correct), per site, without one site's failure aborting the others.
  #
  # WHY NOT load the full unpacked MV3 extension in headless Chrome: the MV3 service-
  # worker lifecycle is flaky headless, and the popup fetches our live Vercel
  # /api/predict + GitHub-raw model JSON (more live deps to flake) and renders into a
  # shadow DOM that is fragile to assert on. The trampoline-against-live-DOM approach
  # is the sanctioned tractable alternative: Playwright supplies the live hydrated DOM,
  # the trampoline supplies the real in-page extractor code. See the harness header for
  # the full rationale.
  #
  # It is a HARD smoke (no continue-on-error): a failure here is consumed by the
  # issue-on-failure job (C) exactly like the spider arm. It is still NON-PR-BLOCKING
  # because this whole workflow only runs on a schedule / manual dispatch.
  extension-headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python (Playwright driver for the live fetch)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Headless live in-browser extraction + popup smoke (per site x rent/sale)
        id: headless
        env:
          SMOKE_SITES: ${{ github.event.inputs.sources || 'all' }}
          SMOKE_RETRIES: '3'
          SMOKE_NAV_TIMEOUT_MS: '45000'
          SMOKE_JSON: '1'      # emit the <<<SMOKE_JSON>>> block the issue body captures
        run: |
          # Tee so we can both stream the log AND capture the machine-readable JSON
          # block + a human matrix for the drift issue. The harness exits 1 on any
          # hard live-extraction FAIL (null / implausible extraction, popup wouldn't
          # render, sale/rent fork wrong) and 0 when every seeded cell is plausible.
          set -o pipefail
          node chrome-extension/headless_extraction_smoke.mjs 2>&1 | tee /tmp/headless_smoke.log

      - name: Capture results for the drift issue (always)
        if: always()
        run: |
          # Extract the machine-readable JSON envelope + the summary matrix so job C
          # can drop the per-site results + captured DOM diff into the issue body.
          awk '/<<<SMOKE_JSON>>>/{f=1;next} /<<<END_SMOKE_JSON>>>/{f=0} f' \
            /tmp/headless_smoke.log > /tmp/headless_smoke.json || true
          awk '/HEADLESS SMOKE SUMMARY/{f=1} f' /tmp/headless_smoke.log > /tmp/headless_smoke_summary.txt || true
          echo "----- captured summary -----"; cat /tmp/headless_smoke_summary.txt || true

      - name: Upload headless smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-extraction-smoke
          path: |
            /tmp/headless_smoke.log
            /tmp/headless_smoke.json
            /tmp/headless_smoke_summary.txt
          if-no-files-found: ignore
          retention-days: 30

  # === C. Open / reuse a GitHub issue when EITHER live arm detects drift ===
  #
  # Non-blocking by construction: this is the ONLY consumer of the smoke results.
  # It `needs` BOTH live arms and runs `if: failure()`, so a drift signal from the
  # spider arm OR the headless extension arm files (or comments on) ONE shared
  # `extraction-drift` issue instead of red-gating anything. The headless artifacts
  # (per-site PASS/FAIL matrix + captured DOM markers) are downloaded so the issue
  # body shows WHAT the live page now looks like vs the committed fixture.
  notify-drift:
    needs: [spider-live-smoke, extension-headless-smoke]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Download headless smoke artifacts (if the extension arm ran)
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: headless-extraction-smoke
          path: /tmp/headless
        continue-on-error: true   # spider-arm-only failures won't have produced these

      - name: Open / update extraction-drift issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Which arm(s) failed?
            const spiderFailed = ${{ needs.spider-live-smoke.result == 'failure' }};
            const headlessFailed = ${{ needs.extension-headless-smoke.result == 'failure' }};

            // Pull the headless per-site matrix + captured DOM markers, if present.
            let headlessBlock = '';
            try {
              const summary = fs.readFileSync('/tmp/headless/headless_smoke_summary.txt', 'utf8').trim();
              if (summary) headlessBlock += '\n```\n' + summary.slice(0, 4000) + '\n```\n';
            } catch (e) {}
            try {
              const raw = fs.readFileSync('/tmp/headless/headless_smoke.json', 'utf8').trim();
              if (raw) {
                const parsed = JSON.parse(raw);
                const bad = (parsed.results || []).filter(r => r.status === 'FAIL');
                if (bad.length) {
                  headlessBlock += '\n**Live extension FAIL cells (with captured DOM markers):**\n';
                  for (const r of bad.slice(0, 12)) {
                    const ex = (r.fields && r.fields.domExcerpt) ? ` \n    live DOM: ${String(r.fields.domExcerpt).split('\\n')[0]}` : '';
                    headlessBlock += `- \`${r.site}/${r.mode}\`: ${r.reasons[0] || ''}${ex}\n`;
                  }
                }
              }
            } catch (e) {}

            const title = 'Extraction drift detected (weekly live smoke)';
            const body = [
              'The weekly **extraction-drift live smoke** failed. This catches what the',
              'frozen-fixture PR CI structurally cannot: a site migrating its LIVE DOM /',
              'JSON shape out from under our selectors (the committed fixtures keep passing',
              'green against the OLD shape).',
              '',
              `**Failed arms:** ${[spiderFailed && 'spider-live-smoke', headlessFailed && 'extension-headless-smoke'].filter(Boolean).join(', ') || '(see run)'}`,
              `**Failed run:** [${context.runId}](${runUrl})`,
              '',
              spiderFailed
                ? '• `spider-live-smoke`: open its job log and read the `DRIFT:` lines for the exact spider + mode + signal (0 cards / wrong-magnitude price / sqft collapse).'
                : '',
              headlessFailed
                ? '• `extension-headless-smoke`: the in-browser content.js extraction mis-extracted or would not render on a live detail page. Per-site matrix + captured DOM markers below; full log in the run artifacts (`headless-extraction-smoke`).'
                : '',
              headlessBlock,
              '',
              'Likely actions: update the affected spider selectors / section URL / JSON path,',
              'refresh the committed fixture to the new live shape, and (extension) re-check',
              'content.js against the new page structure (e.g. the __PAGE_MODEL / __next_f /',
              'innerText path the extractor reads). If a headless cell shows a 404/SKIP, the',
              'seeded URL in `headless_extraction_smoke.mjs :: LIVE_URLS` just needs refreshing.',
            ].filter(l => l !== '').join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extraction-drift',
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['extraction-drift', 'automated'],
              });
            } else {
              // Reuse the open issue; add a comment with this run's arm(s) + matrix.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Drift smoke failed again: [run ${context.runId}](${runUrl}).\n${body}`,
              });
            }
