name: Generate Predictions Cache

on:
  workflow_run:
    # FIX (#9): chain off the workflow that actually retrains the model.
    # There is no workflow named "Train Model"; training happens inside
    # "Daily Property Scrape" (daily-scrape.yml), which retrains the canonical
    # model and commits output/rental_model_canonical.pkl. Triggering off that
    # name is what makes scrape -> retrain -> predictions chain at all.
    workflows: ["Daily Property Scrape"]
    types: [completed]
  workflow_dispatch:  # Manual trigger

env:
  # Predictions must read the SAME store the scrape wrote and the dashboard serves.
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy pandas xgboost scikit-learn psycopg2-binary

      - name: Generate predictions from the CANONICAL model
        run: |
          # FIX (#9): single source of truth for feature construction.
          # scripts/generate_predictions.py loads output/rental_model_canonical.pkl
          # (the model daily-scrape just retrained & committed) and builds features
          # via rental_price_models_v20.engineer_features_v20 — NOT a hand-coded inline
          # v15 feature dict. Reads active listings from Postgres (POSTGRES_URL).
          python3 scripts/generate_predictions.py

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chrome-extension/api/predictions.json
          git diff --staged --quiet || git commit -m "Update predictions cache (canonical model) [skip ci]"
          git push
