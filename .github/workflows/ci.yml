name: CI

# The full pre-merge CI (#49). Runs on every push + PR and gates merge. Three jobs,
# each independently required:
#   1. python-tests  — the pytest suite (UNIT + self-contained; data-validation tests
#                      auto-skip without a DB via tests/conftest.py) + a coverage gate.
#   2. node-parity   — the JS↔Python feature/£ parity harness (extension predictor).
#   3. dashboard     — TypeScript type-check (tsc --noEmit) + next lint.
#
# Data-validation tests (need a populated rentals.db) and live scrape tests run in
# daily-scrape.yml (post-scrape), NOT here — CI has no DB. The extension-drift-guard
# and neon-backup workflows stay as their own required checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # === 1. Python test suite + coverage gate ===
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Model deps: requirements.txt is the SCRAPER's deps and omits these, but the
          # model regression tests (#47, tests/test_model_inference.py) import
          # canonical_predict → need the ML stack. Same set the node-parity job installs.
          pip install numpy pandas xgboost scikit-learn
          pip install pytest pytest-cov

      - name: Run unit + self-contained tests with coverage
        run: |
          # Default pytest excludes `live` (network) tests and, via conftest.py,
          # skips data-validation tests when no rentals.db is present (CI has none).
          # ALSO exclude `parity` here: the node-parity JOB already runs
          # fixture_diff.mjs (regen-then-diff, more robust), so the pytest parity
          # wrapper (#47) would be a redundant double-run. It still runs in a local
          # bare `pytest` for dev convenience.
          #
          # ANTI-SILENT-SKIP (#49): tests/test_ci_critical_tests_run.py runs as part of
          # this suite and FAILS if any test on the CRITICAL allowlist is missing or
          # skip-marked in CI — so a load-bearing regression guard that silently stops
          # running fails the build instead of hiding behind a green suite. The
          # --strict-markers in pytest.ini turns a typo'd marker into a hard error.
          #
          # COVERAGE GATE: --cov-fail-under is a FLOOR that RATCHETS UP as the test
          # owners (#45-48) land tests. Set to the current measured baseline so it
          # catches a REGRESSION without blocking a PR on a number the suite hasn't
          # reached (trajectory + 70%-core-logic target in TEST_SUITE_OVERVIEW.md).
          # Cov scope = the app modules + the root model modules the #47 tests exercise.
          # M15 (Wave 2): add `for_sale` so the 2180-line for-sale money-path vertical is
          # MEASURED (was entirely unmeasured — a sale-model/serving/CLI coverage
          # regression was invisible). Scope only; the --cov-fail-under floor is unchanged.
          pytest \
            -m "not live and not parity" \
            --cov=property_scraper --cov=automation --cov=cli --cov=scripts \
            --cov=canonical_predict --cov=retrain_canonical --cov=rental_price_models_v20 \
            --cov=for_sale \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=5 \
            --junitxml=pytest-results.xml \
            -q

      - name: Assert a sane number of tests actually EXECUTED (not all-skipped)
        if: always()
        run: |
          # Belt-and-braces floor on the silent-skip class: if conftest itself broke, or
          # the env regressed so the whole suite skipped, the count collapses and we fail
          # loudly. This is a coarse global guard; the per-test allowlist meta-test is the
          # precise one. Keep the floor comfortably BELOW the real executed count so a
          # normal PR never trips it, but a collapse to a handful does.
          # M19 (Wave 2): the suite grew — CI now executes ~390+ (no live DB / no
          # tesseract). The old 120 floor was set when CI ran ~197 and would no longer
          # catch a collapse that halves the suite. Raised to 360 (headroom below the real
          # ~390+ count, far above the original 120 noise floor).
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          MIN_EXECUTED = 360  # CI executes ~390+; alarm well below that, above noise.
          t = ET.parse("pytest-results.xml").getroot()
          suites = t.iter("testsuite")
          total = skipped = errors = failures = 0
          for s in suites:
              total += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
              errors += int(s.get("errors", 0))
              failures += int(s.get("failures", 0))
          executed = total - skipped
          print(f"tests={total} executed={executed} skipped={skipped} "
                f"failures={failures} errors={errors}")
          if executed < MIN_EXECUTED:
              print(f"::error::Only {executed} tests executed (< {MIN_EXECUTED}). The suite "
                    f"likely silently collapsed to skips — investigate conftest/env before "
                    f"trusting this green.")
              sys.exit(1)
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # === 2. JS ↔ Python parity (extension predictor) ===
  node-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps (for fresh-golden regen)
        run: pip install numpy pandas xgboost scikit-learn

      - name: Regenerate golden from Python, then diff JS vs it
        run: |
          # Same logic as extension-drift-guard's fixture-diff: regenerate the golden
          # from canonical_predict so JS is checked against FRESH Python truth.
          python3 gen_feature_parity_golden.py

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: JS↔Python feature/£ parity (fail on drift)
        run: node chrome-extension/fixture_diff.mjs

      - name: SALE JS↔Python parity (Inc4a) — regen golden from committed model, then diff (must be 0/0)
        run: |
          # Mirror the rental fixture-diff for the for-sale vertical (Inc4a). gen_sale_golden.py
          # LOADS the COMMITTED output/sale_api/model.json as a Booster and RE-SCORES the 15 golden
          # inputs (inference=True, baked maps) — it does NOT retrain — so the £ values track the
          # exact model the route serves, byte-safe across xgboost minor versions. Then the sale
          # parity harness diffs the JS sale predictor vs that fresh golden: 0 feature + 0 £ mismatch.
          python3 gen_sale_golden.py
          node chrome-extension/sale_fixture_diff.mjs

      - name: Extension extraction tests (per-site, vs real fixtures)
        run: |
          node chrome-extension/rightmove_extract_test.mjs
          node chrome-extension/knightfrank_extract_test.mjs
          node chrome-extension/foxtons_extract_test.mjs
          node chrome-extension/floorplan_discovery_test.mjs
          node chrome-extension/foxtons_ocr_skip_test.mjs
          # R5/A11 — the EXTRACTION->FEATURES BRIDGE test (the test CLASS that was entirely
          # absent). Runs the REAL content.js extract on a captured Rightmove fixture and
          # asserts rawFields.summary is populated (the model's text_blob = summary + ' ' +
          # description; summary was never set, so all 10 text-amenity features computed off
          # an empty field) AND that buildFeatures fires the amenity feature(s) the prose
          # implies with no load-bearing feature collapsing to a default (postcode!=SW3,
          # size!=estimated). The rental fixture_diff parity gate runs buildFeatures on
          # SYNTHETIC samples (not via content.js), so this does NOT affect the 0/0 gate.
          node chrome-extension/extract_to_features_bridge_test.mjs
          # Behavioural guards for recent extension work that were passing green but
          # wired into NO workflow (zero PR-CI protection until now):
          #   similar_properties_test — the comps location HARD-gate in
          #     findSimilarProperties (the "comps totally off" fix). A regression that
          #     re-softens the location gate is invisible without this.
          #   content_load_test — content.js loads without throwing (the log/logError
          #     infinite-recursion crash that broke the plugin on EVERY site) + the
          #     bounded SPA-retry guard.
          node chrome-extension/similar_properties_test.mjs
          node chrome-extension/content_load_test.mjs

      - name: For-sale (Inc4) per-site detection + extraction tests (vs real/derived fixtures)
        run: |
          # Inc4 — the Chrome extension For Sale Fair Value mode on real "to buy" detail pages.
          # Per site: detectTenure → 'sale' + analyzeSale's model-input fields resolve from a
          # REAL captured for-sale detail fixture (KnightFrank derived; flagged). Plus the
          # Chestertons /sales/ regex unblock, the structural POA fork, and the shared sale OCR.
          # RENTAL REGRESSION is guarded by rental_regression_guard_test (detection still 'rent').
          node chrome-extension/rightmove_sale_extract_test.mjs
          node chrome-extension/foxtons_sale_extract_test.mjs
          node chrome-extension/chestertons_sale_extract_test.mjs
          node chrome-extension/savills_sale_extract_test.mjs
          node chrome-extension/knightfrank_sale_extract_test.mjs
          node chrome-extension/structural_sale_poa_test.mjs
          node chrome-extension/rental_regression_guard_test.mjs

      - name: Anti-silent-skip guard (a critical extension harness silently stopped running)
        run: |
          # SYSTEMIC FIX: assert that EVERY extension harness ci.yml is supposed to run
          # is actually invoked above. A renamed/removed/typo'd harness — the exact
          # "green locally, dark in CI" failure class — fails THIS step loudly instead
          # of silently shrinking coverage. The allowlist is the source of truth; adding
          # a harness without listing it here (or vice-versa) is a hard error.
          node chrome-extension/ci_harness_guard.mjs

  # === 3. Dashboard type-check + lint ===
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint (non-blocking until ESLint is configured for Next 16)
        # NOTE: Next.js 16 REMOVED `next lint` (the package.json "lint" script is dead —
        # it resolves "lint" as a directory and no-ops). There is no ESLint config in
        # dashboard/ yet. tsc --noEmit above is the load-bearing type gate. This step is
        # non-blocking until serving (dashboard owner) adds a flat ESLint config + eslint
        # dep; then flip continue-on-error off to make lint a hard gate. Flagged to serving.
        continue-on-error: true
        run: |
          if [ -f .eslintrc.json ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint . --max-warnings=0
          else
            echo "::warning::No ESLint config in dashboard/ — lint skipped (Next 16 removed 'next lint'). Serving to add flat ESLint config."
          fi

  # === 4. Dashboard route BEHAVIOR (real Postgres + real model) ===
  #
  # Closes the gap where /api/predict + /api/similar route handlers had NO
  # CI-executing behavioral test (tests/test_api_dashboard.py SKIPS in CI — it needs
  # node+next+testing.postgresql and @vercel/postgres can't reach a plain local PG).
  #
  # Approach (the lightest reliable one that runs green in GH Actions):
  #   * /api/predict — runs the route's INLINE predictor pipeline (the vendored
  #     xgboost.predictor.js + buildFeatures -> predict -> expm1 -> range, identical to
  #     the route) against the REAL committed v20 model. No DB, no network (model is
  #     pre-seeded into the predictor's cache from the committed artifacts).
  #   * /api/similar — runs the route's ACTUAL query (the single-source similarQuery.js
  #     that db.ts imports) against a REAL Postgres SERVICE CONTAINER via the `pg`
  #     driver, seeded with fixture listings, asserting seeded peers + stats.
  #   This sidesteps @vercel/postgres's neon-only transport (which would need a fragile
  #   neon proxy for a local PG) by testing the route's query logic directly — same SQL,
  #   same params, same stats helper the route runs, guarded by a structural-parity check.
  dashboard-routes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The similar-query harness reads this; points at the service container.
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps (includes the `pg` driver the similar harness uses)
        run: npm ci

      - name: /api/predict — real v20 estimate (no DB, no network)
        run: node test/predict_estimate_test.mjs

      - name: /api/similar — real query vs seeded Postgres service container
        run: node test/similar_query_test.mjs

      - name: /api/predict-sale — real sale_v1 estimate (Inc4a; no DB, no network)
        run: node test/predict_sale_estimate_test.mjs

      - name: /api/similar-sale — real query vs seeded Postgres (Inc4a; SSTC-exclude + graceful-empty)
        run: node test/similar_sale_query_test.mjs

      # === Wave 2 — route-HANDLER + dual-SQL parity + query-bug documenting harnesses ===
      - name: A6 — actual Next.js RENTAL route handlers (400 / CORS / 503 / 500-vs-empty)
        run: node test/route_handler_test.mjs

      - name: A6 — actual Next.js FOR-SALE route handlers (sale-specific 400/503 divergences)
        run: node test/route_handler_sale_test.mjs

      - name: A7 — dual-SQL byte-equality (db.ts↔similarQuery.js, saleDb.ts↔saleSimilarQuery.js)
        run: node test/dual_sql_equality_test.mjs

      - name: R6/A8 — serving query-bug DOCUMENTING tests (no-space postcode + stale peer; xfail)
        run: node test/serving_query_bug_doc_test.mjs

      - name: Anti-silent-skip — assert the route harnesses are wired + ran
        run: |
          # Mirror chrome-extension/ci_harness_guard for the dashboard route harnesses:
          # if one is renamed/removed/un-wired, fail LOUD instead of silently shrinking
          # coverage. (The similar harness must NOT have skipped for lack of a DB here —
          # the service container guarantees POSTGRES_TEST_URL is set + reachable.)
          node test/dashboard_routes_guard.mjs

  # === 5. For-sale prod-write SYNC safety vs a REAL Postgres (Test A) ===
  # The deepest layer of the for-sale prod-write safety net. The python-tests job
  # has NO Postgres container, so the REAL-PG sale-sync safety suite
  # (tests/test_sale_sync_real_pg.py) runs in this DEDICATED job against a
  # `postgres:16` SERVICE CONTAINER — mirroring the dashboard-routes block exactly so
  # the sync's CREATE-TABLE idempotency, BIGINT round-trip, UPSERT non-destructiveness,
  # first_seen-immutability, backup-before-write and >5% delta-abort guards are proven
  # against a genuine Postgres engine (not a SQLite stand-in). The in-process Layer-1
  # gate (tests/test_sale_data_layer_safety.py) still runs in python-tests for the
  # no-DB PR lane; this job is its real-PG deepening. The test GRACEFUL-SKIPS without
  # POSTGRES_TEST_URL, so the service container here is what makes it run for real —
  # the W3 meta-assert in tests/test_ci_critical_tests_run.py pins this job + its
  # invocation + the postgres:16 image so it can't be silently deleted.
  sale-sync-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # tests/test_sale_sync_real_pg.py reads this; points at the service container.
      # (When unset the suite graceful-skips — the container guarantees it is set here.)
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps (requirements.txt already pins psycopg2-binary; explicit too)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary
          pip install pytest

      - name: Test A — REAL-Postgres for-sale sync safety (A1–A9)
        run: pytest tests/test_sale_sync_real_pg.py -v
