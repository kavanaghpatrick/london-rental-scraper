name: Predict Fair Value

on:
  repository_dispatch:
    types: [predict]

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install numpy pandas xgboost scikit-learn

      - name: Run prediction (canonical model)
        id: predict
        env:
          PROPERTY_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          # FIX (#9): predict via the CANONICAL model + canonical feature pipeline.
          # scripts/predict_one.py loads output/rental_model_canonical.pkl and builds
          # features with rental_price_models_v20.engineer_features_v20 — NOT a hand-coded
          # v15 feature dict and NOT rental_model_v15.pkl. Same model the cache + extension use.
          echo "$PROPERTY_DATA" | python3 scripts/predict_one.py

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: prediction
          path: prediction_result.json
          retention-days: 1

      - name: Output result URL
        run: |
          echo "Prediction complete! Result saved as artifact."
