","OriginalPriceText":"£800,000","ShortDisplayPriceText":"£800k","ShortOriginalPriceText":"£800k","BaseCurrency":"GBP","DisplayCurrency":"GBP","ShowPrice":true,"FluxProBrochure":"https://savills.fluxpro.io/Brochure/KNU250108","OtherFeesText":"","OtherFeesLink":"","Description":"A thoughtfully updated 19th century cottage set within private grounds, offering generous living space and a lovely rural setting.","Location":["Wheelwright Cottage is ideally positioned in the charming village of Buerton, just 1.2 miles from the award winning village of Audlem. Audlem is an attractive and exceptionally well serviced country village, with its historic centre designated as a Conservation Area. Renowned for its beautiful 13th century church, dating back to 1279, the village offers an excellent range of day to day amenities including a medical practice, chemist, primary school, play group, three welcoming public houses and a variety of independent shops. The village is also home to the impressive flight of 15 locks on the Shropshire Union Canal, making it popular with walkers and boating enthusiasts.","The historic market town of Nantwich lies approximately 7 miles away and is celebrated for its rich architectural heritage, bustling market centre and wider selection of shopping, leisure and dining facilities.","Families will find a strong choice of educational options in the area. Audlem Primary School is highly regarded, and secondary schooling is accessible in nearby towns, including well rated options within Nantwich. The region is also served by respected independent schools such as Newcastle under Lyme School, which is within practical travelling distance. School transport routes operate locally, offering convenient access to a number of popular secondary and independent schools.","Connectivity is another key benefit of this location. Cheshire is crossed by four major motorways, providing fast links to key commercial centres across the country. The A500 Link Road provides swift access to the wider motorway network. Manchester Airport, one of Europe’s busiest international hubs is approximately 40 miles by car. Crewe railway station offers frequent mainline services, including direct trains to London Euston in as little as 1 hour 30 minutes, along with excellent links to Manchester, Liverpool and other major cities. Both Manchester and Liverpool offer outstanding cultural, sporting and leisure opportunities, including world class football, theatres, concert venues and museums.","(All travel times and distances are approximate.)"],"LongDescription":[{"Head":"","Body":"Set beyond imposing private gates and positioned within beautifully tended grounds of approximately 0.45 acres, Wheelwright Cottage is an exceptional early 19th century home that has been sympathetically restored and significantly enlarged. Tastefully extended in 2005 and further refined in 2017, the property now presents as an exquisitely finished family residence combining period charm with contemporary comfort. Located in the highly desirable rural hamlet of Chapel End and within an easy stroll of Audlem village, the setting offers an idyllic balance of pastoral tranquillity and everyday convenience.\u003cBR/\u003e\u003cBR/\u003eThe house showcases an abundance of character features, including exposed beams and trusses, impressive fireplaces with multi fuel stoves, solid oak and limestone flooring, and a striking galleried landing. Bespoke arched timber windows and premium external doors crafted by Timber Windows of Knutsford further enhance the home's architectural appeal. Presentation throughout is exemplary, with light filled spaces and generous room proportions.\u003cBR/\u003e\u003cBR/\u003eThe ground floor centres around a remarkable open plan kitchen breakfast room with vaulted ceilings and skylights, complemented by a utility room, guest WC and four versatile reception rooms, including a superb family room, elegant lounge, formal dining room and a charming snug or home office.\u003cBR/\u003e\u003cBR/\u003eTo the first floor, a bright galleried landing leads to four well sized bedrooms, each enjoying open countryside views. The principal and second bedrooms benefit from stylish ensuite shower rooms and fitted wardrobes, while a beautifully appointed family bathroom serves the remaining accommodation.\u003cBR/\u003e\u003cBR/\u003eExternally, the gardens are a true highlight. Extensive lawns, mature borders and hedging wrap around the property, creating a wonderfully private environment. A gravel driveway leads to a detached double garage, while the south facing rear garden offers a generous terrace, ideal for outdoor dining and relaxation.\u003cBR/\u003e\u003cBR/\u003eWheelwright Cottage represents a rare opportunity to acquire a home of exceptional quality, beautifully positioned within a sought after rural setting and ready to enjoy from the moment you arrive.\u003cbr/\u003e\u003cbr/\u003e\u003ca class=\"sv--link\" href=\"http://www.savills.co.uk/stamp-duty-calculator/index.html#800000\"\u003eView payable Stamp Duty for this property\u003c/a\u003e"}],"AdditionalInformation":["Council Tax Band G","EPC Rating: C","Tenure: Freehold","Council Tax Band: G"],"AreaGuide":{"AreaGuideId":1,"AreaGuideBaseTitle":"AREA GUIDES","AreaGuideTitle":"Discover Richmond Upon Thames","AreaGuideDescription":"Explore Richmond one of London's most picturesque boroughs and favourite retreat of royalty. Truely a jewel in London's crown. ","AreaGuideImageUrl":"http://dev-search.savills.com/content/img/MockedAreaGuide.PNG","AreaGuideDetailCaption":"Read the area guide","AreaGuideDetailUrl":"http://savills.co.uk"},"QuoteText":"I personally love this location, rural lifestyle yet perfect for commuters.","PointsOfInterest":[],"ShowFacebook":true,"HasFloorplan":true,"VideoUrl":{"URL":null,"CaptionTranslations":"{}","UrlCaption":""},"Video360":{"URL":null,"CaptionTranslations":"{}","UrlCaption":""},"ExternalUrl":{"URL":null,"CaptionTranslations":"{\"en\":\
